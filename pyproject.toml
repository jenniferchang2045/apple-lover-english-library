[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-lover-english-library"
version = "0.2.3"
description = "apple_lover个人英文原版书库：本地导入、公版下载、导读笔记"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "httpx>=0.27",
  "fastapi>=0.115",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30",
  "pypdfium2>=4.30",
  "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "pypdf>=5.0",
]

[project.scripts]
apple-lover-library = "apple_lover_library.cli:main"

[tool.setuptools.packages.find]
where = ["packages/library/src"]

[tool.setuptools.package-data]
apple_lover_library = ["templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["packages/library/src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
